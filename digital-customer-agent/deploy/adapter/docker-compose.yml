services:
  digital-customer-agent-adapter:
    build:
      context: ../../adapter
    image: digital-customer-agent-adapter:latest
    container_name: digital-customer-agent-adapter
    env_file:
      - ../../adapter/.env
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
